name: Update Nushell

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y git rpm-build rpmdevtools spectool copr-cli curl jq

      - uses: actions/checkout@v4

      - name: Check versions
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          LATEST=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/nushell/nushell/releases/latest | jq -r .tag_name)
          LATEST=${LATEST#v}
          CURRENT=$(awk '/^Version:/{print $2}' nushell.spec)
          echo "latest=$LATEST current=$CURRENT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump spec
        if: steps.ver.outputs.update == 'true'
        run: |
          rpmdev-bumpspec -n "${{ steps.ver.outputs.latest }}" \
            -c "Update to ${{ steps.ver.outputs.latest }}" \
            -u "GitHub Actions <actions@github.com>" nushell.spec

      - name: Build SRPM
        if: steps.ver.outputs.update == 'true'
        run: |
          spectool -g -R nushell.spec
          rpmbuild -bs nushell.spec

      - name: Submit to COPR
        if: steps.ver.outputs.update == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          echo "$COPR_CONFIG" > ~/.config/copr
          copr-cli build cosmicpredator/nushell ~/rpmbuild/SRPMS/*.src.rpm

      - name: Commit spec
        if: steps.ver.outputs.update == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nushell.spec
          git commit -m "Update to ${{ steps.ver.outputs.latest }}"
          git push